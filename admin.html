<style>
/*@FONTS*/
:root{
  color-scheme:light;
  --rose:#aa6667; --blush:#ca9e9d; --white:#fff; --tint:#f5eceb;
  --sans:"Thmanyah Sans","IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--rose)}
html,body{margin:0;min-height:100%}
body{color:var(--rose);background:var(--rose);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
h1,h2,p{margin:0}
h1,h2{font-weight:700;line-height:1.25}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--white);outline-offset:3px}
.sheet :focus-visible,.gate :focus-visible{outline-color:var(--rose)}

.wrap{max-width:1040px;margin:0 auto;padding:22px 20px 48px;display:grid;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:42px}
.brand{width:118px;color:var(--blush)}
.brand svg{display:block;width:100%;height:auto}
.actions{display:flex;gap:8px}
.actions button{background:transparent;color:var(--blush);border:1.5px solid rgba(202,158,157,.55);border-radius:999px;padding:8px 16px;font-weight:500}
.actions button:hover{border-color:var(--blush);color:var(--white)}
.reset{display:grid;gap:12px;background:var(--tint);border-radius:18px;padding:18px 18px 16px}
.reset p{font-weight:500}
.reset label{display:grid;gap:8px;font-weight:700}
.reset input{border:0;background:var(--white);border-radius:14px;padding:14px 16px;font-weight:500}
.reset-row{display:flex;gap:8px;align-items:center}
.reset .go{border:0;background:var(--rose);color:var(--white);border-radius:14px;padding:12px 18px;font-weight:700}
.reset .stop{background:transparent;border:0;padding:12px 8px;font-weight:500}

#loginView{display:grid;justify-items:center;padding-top:7vh}
.gate{width:min(420px,100%);background:var(--white);border-radius:22px;padding:28px 24px;display:grid;gap:16px}
.mark{width:72px;margin:0 auto 14px;color:var(--blush)}
.mark svg{display:block;width:100%;height:auto}
.gate h1{font-size:32px}
.gate p{font-size:16px;font-weight:500}
.gate label{display:grid;gap:8px;font-weight:700}
.gate input{border:0;background:var(--tint);border-radius:16px;padding:16px 18px;font-size:17px;font-weight:500}
.gate .go{border:0;background:var(--rose);color:var(--white);border-radius:16px;padding:16px;font-size:18px;font-weight:700}
.gate .go:active{transform:scale(.985)}
.err{font-weight:700}

.sheet{background:var(--white);border-radius:22px;padding:28px 26px 30px;display:grid;gap:28px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px}
.head h1{font-size:34px}
.head span{font-weight:500}

.figures{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px}
.fig{background:var(--tint);border-radius:18px;padding:18px 20px 16px;display:grid;gap:4px;align-content:end;min-height:128px}
.fig span{font-size:15px;font-weight:500}
.fig strong{font-size:56px;line-height:.95;font-weight:700;font-variant-numeric:tabular-nums}
.fig.side strong{font-size:44px}
.lead{font-size:18px;font-weight:500}

.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start}
.block{display:grid;gap:16px;align-content:start}
.block h2{font-size:22px}
.people{display:grid;gap:14px}
.person{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.emo{font-size:26px;line-height:1;width:42px;text-align:center}
.who{display:grid;gap:7px}
.who .line{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.who b{font-size:16px}
.who .pct{font-size:13px;font-weight:700}
.track{height:7px;border-radius:99px;background:var(--tint);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--rose);border-radius:inherit}
.person .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch;text-align:left}

.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chart-head span{font-size:14px;font-weight:500}
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:196px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0}
.col b{font-size:11px;font-weight:700;line-height:1;min-height:13px}
.col i{display:block;width:min(100%,16px);border-radius:99px;background:var(--blush);min-height:4px}
.col.today i{background:var(--rose)}
.col span{font-size:11px;font-weight:700;line-height:1}
.col.zero b{visibility:hidden}
.plist{display:grid}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--tint);font-weight:500}
.prow b{direction:ltr;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:800px){
  .sheet{padding:22px 16px 24px}
  .head h1{font-size:28px}
  .figures{grid-template-columns:1fr 1fr}
  .fig.main{grid-column:1 / -1;min-height:0}
  .fig strong{font-size:48px}
  .cols{grid-template-columns:1fr;gap:26px}
  .chart{height:168px;gap:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
  var KEY = "elm-bloom-admin";
  var AR = "٠١٢٣٤٥٦٧٨٩";
  var MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  var $ = function(id){ return document.getElementById(id); };
  function ar(n){ return String(n).replace(/\d/g, function(d){ return AR[d]; }); }
  function shiftDay(iso, by){
    var p = iso.split("-").map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    d.setUTCDate(d.getUTCDate() + by);
    return d.toISOString().slice(0, 10);
  }
  function dayNum(iso){ return ar(Number(iso.slice(8))); }
  function longDate(iso){
    var p = iso.split("-").map(Number);
    return ar(p[2]) + " " + MONTHS[p[1] - 1];
  }

  function showLogin(bad){
    $("loginView").hidden = false;
    $("board").hidden = true;
    $("actions").hidden = true;
    $("loginErr").hidden = !bad;
    closeReset();
  }

  function render(data){
    $("loginView").hidden = true;
    $("board").hidden = false;
    $("actions").hidden = false;
    $("boardErr").hidden = true;

    var today = data.days[data.days.length - 1].date;
    var yIso = shiftDay(today, -1);
    var yCount = 0;
    data.days.forEach(function(d){ if(d.date === yIso) yCount = d.count; });

    $("total").textContent = ar(data.total);
    $("today").textContent = ar(data.today);
    $("yesterday").textContent = ar(yCount);
    $("when").textContent = longDate(today);

    var ranked = data.personalities.slice().sort(function(a, b){ return b.count - a.count; });
    var top = ranked[0];
    var second = ranked[1] ? ranked[1].count : 0;
    if(!data.total) $("lead").textContent = "ما فيه نتائج بعد.";
    else if(top.count === second) $("lead").textContent = "النتائج متقاربة بين الشخصيات.";
    else $("lead").textContent = top.name + " هي الأعلى، " + ar(top.count) + " من " + ar(data.total);

    var max = Math.max.apply(null, data.personalities.map(function(p){ return p.count; }).concat([1]));
    $("types").innerHTML = data.personalities.map(function(p){
      var w = Math.round(p.count / max * 100);
      var pct = data.total ? Math.round(p.count / data.total * 100) : 0;
      return '<div class="person"><span class="emo">' + p.emoji + '</span><div class="who"><div class="line"><b>' + p.name + '</b><span class="pct">' + ar(pct) + '٪</span></div><span class="track"><i style="width:' + w + '%"></i></span></div><b class="n">' + ar(p.count) + '</b></div>';
    }).join("");

    var days = data.days.slice(-14);
    var maxDay = Math.max.apply(null, days.map(function(d){ return d.count; }).concat([1]));
    $("chart").innerHTML = days.map(function(d){
      var h = d.count ? Math.max(12, Math.round(d.count / maxDay * 132)) : 4;
      var cls = (d.date === today ? " today" : "") + (d.count ? "" : " zero");
      return '<div class="col' + cls + '"><b>' + ar(d.count) + '</b><i style="height:' + h + 'px"></i><span>' + dayNum(d.date) + '</span></div>';
    }).join("");
    $("chartText").textContent = days.map(function(d){
      var name = d.date === today ? "اليوم" : (d.date === yIso ? "أمس" : longDate(d.date));
      return name + " " + ar(d.count);
    }).join("، ");

    var list = data.phones || [];
    $("phoneCount").textContent = ar(list.length);
    $("phones").innerHTML = list.length
      ? '<div class="plist">' + list.map(function(p){
          return '<div class="prow"><b>' + p.phone + '</b><span>' + p.name + '</span><span>' + longDate(p.date) + '</span></div>';
        }).join("") + '</div>'
      : '<p class="lead">ما فيه أرقام بعد.</p>';
  }

  function load(){
    var password = sessionStorage.getItem(KEY) || "";
    if(!password){ showLogin(false); return; }
    fetch("/api/stats", { headers: { authorization: "Bearer " + password }, cache: "no-store" })
      .then(function(r){
        if(r.status === 401){ sessionStorage.removeItem(KEY); showLogin(true); return null; }
        if(!r.ok) throw new Error("stats");
        return r.json();
      })
      .then(function(data){ if(data) render(data); })
      .catch(function(){
        $("loginView").hidden = true;
        $("board").hidden = false;
        $("actions").hidden = false;
        $("boardErr").hidden = false;
      });
  }

  $("login").addEventListener("submit", function(e){
    e.preventDefault();
    sessionStorage.setItem(KEY, $("password").value);
    $("password").value = "";
    load();
  });
  $("logout").addEventListener("click", function(){
    sessionStorage.removeItem(KEY);
    showLogin(false);
  });
  $("reload").addEventListener("click", load);
  function closeReset(){
    $("resetForm").hidden = true;
    $("resetSecret").value = "";
    $("resetErr").hidden = true;
    $("resetGo").disabled = false;
  }
  $("resetOpen").addEventListener("click", function(){
    $("resetForm").hidden = false;
    $("resetErr").hidden = true;
    $("resetSecret").value = "";
    $("resetForm").scrollIntoView({ block: "nearest" });
    $("resetSecret").focus();
  });
  $("resetCancel").addEventListener("click", closeReset);
  $("resetForm").addEventListener("submit", function(e){
    e.preventDefault();
    var password = sessionStorage.getItem(KEY) || "";
    var secret = $("resetSecret").value;
    $("resetErr").hidden = true;
    $("resetGo").disabled = true;
    fetch("/api/reset", {
      method: "POST",
      headers: { authorization: "Bearer " + password, "content-type": "application/json" },
      body: JSON.stringify({ secret: secret })
    }).then(function(r){
      $("resetGo").disabled = false;
      if(r.status === 401){ sessionStorage.removeItem(KEY); showLogin(true); return null; }
      if(r.status === 403){ $("resetErr").hidden = false; $("resetSecret").value = ""; $("resetSecret").focus(); return null; }
      if(!r.ok) throw new Error("reset");
      closeReset();
      return fetch("/api/stats", { headers: { authorization: "Bearer " + password }, cache: "no-store" });
    }).then(function(r){
      if(!r) return null;
      if(!r.ok) throw new Error("stats");
      return r.json();
    }).then(function(data){ if(data) render(data); })
      .catch(function(){
        $("resetGo").disabled = false;
        $("boardErr").hidden = false;
      });
  });
  load();
})();
</script>
</body>
</html>
