<style>
/*@FONTS*/
:root{
  color-scheme:light;
  /* ELM BLOOM 2026. سطحان فقط: وردي غامق تحمله عناصر وردية فاتحة، وأبيض يُكتب عليه بالوردي الغامق */
  --rose:#aa6667; --blush:#ca9e9d; --white:#ffffff;
  --tint:#f5eceb; /* صبغة فاتحة من الوردي الفاتح لخلفيات الخيارات */
  --olive:#59553b; --khaki:#b9ae6f; --moss:#7f7d54; /* ثانوية، غير مستخدمة في الواجهة */
  --sans:"Thmanyah Sans","IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;
  --display:"Thmanyah Serif Display",Georgia,serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--rose)}
html,body{margin:0;min-height:100%}
body{color:var(--rose);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,p{margin:0}
h1,h2{line-height:1.3;text-wrap:balance;font-weight:700}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{position:relative;max-width:480px;margin:0 auto;padding:22px 20px 40px;min-height:100svh;display:flex;flex-direction:column;gap:26px;isolation:isolate}
/* مصدر رسم وردة زاوية النتيجة فقط، وما تظهر في خلفية الصفحة */
.bg-flower{display:none}

/* الرأس: الشعار والشعار اللفظي بالوردي الفاتح على الوردي الغامق، كما في الدليل */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:block;width:118px;color:var(--blush);background:none;border:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.brand svg{display:block;width:100%;height:auto}
.tag{direction:ltr;font-family:var(--display);font-size:13px;font-weight:400;letter-spacing:.06em;line-height:1.25;color:var(--blush);text-align:left;text-transform:uppercase}

.screen{display:grid;gap:18px;align-content:start}
.focus-target:focus{outline:none}
:focus-visible{outline:3px solid var(--white);outline-offset:3px}
.card :focus-visible{outline-color:var(--rose)}

/* الورقة البيضاء: كل ما يُقرأ يُكتب هنا بالوردي الغامق */
.card{position:relative;overflow:hidden;background:var(--white);color:var(--rose);border-radius:22px;padding:26px 22px}

/* البداية */
.hero{display:grid;justify-items:center;text-align:center;gap:10px;padding:16px 0 4px;color:var(--blush)}
.hero .icon{width:84px}
.hero .icon svg{display:block;width:100%;height:auto}
.slogan{font-family:var(--display);font-size:16px;font-weight:400;letter-spacing:.02em}
.intro-card{display:grid;gap:14px}
.intro-card h1{font-size:34px}
.intro-card p{font-size:17px;line-height:1.8}
.primary{justify-self:stretch;margin-top:4px;font-size:19px;font-weight:700;padding:16px 22px;border:0;border-radius:16px;background:var(--rose);color:var(--white);cursor:pointer;transition:transform .15s,background .15s}
.primary:active{transform:scale(.985)}

/* الأسئلة. مؤشر التقدم من نقشة الموسم: بتلة، دائرة، بتلة */
.quiz-card{display:grid;gap:20px;align-content:start;min-height:600px}
.progress{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pattern{display:flex;align-items:center;gap:9px}
.pattern i{display:block;color:var(--blush);opacity:.4;transition:opacity .3s,color .3s}
.pattern i.on{opacity:1;color:var(--rose)}
.pattern i.p{width:18px;height:18px}
.pattern i.d{width:12px;height:12px;border-radius:50%;background:currentColor}
.pattern svg{display:block;width:100%;height:100%}
.count{font-size:14px;font-weight:700;color:var(--blush);font-variant-numeric:tabular-nums}
h2.q{font-size:25px;line-height:1.35}
.options{display:grid;gap:10px}
.opt{display:flex;align-items:center;text-align:right;font-size:17px;font-weight:500;line-height:1.45;min-height:52px;padding:8px 16px;border:1.5px solid var(--tint);border-radius:16px;background:var(--tint);color:var(--rose);cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .15s}
.opt:hover{border-color:var(--blush)}
.opt:active{transform:scale(.99)}
.opt.picked{background:var(--rose);border-color:var(--rose);color:var(--white);font-weight:700}
.back{justify-self:start;font-size:15px;font-weight:500;color:var(--blush);background:none;border:0;padding:4px 0;cursor:pointer}
.back:disabled{visibility:hidden}
.again{justify-self:center;font-size:15px;font-weight:500;color:var(--white);background:none;border:0;padding:4px 8px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* النتيجة: الرسم يطلع فوق البطاقة، والنص يبقى داخلها */
#sResult{gap:16px}
.portrait-wrap{width:min(236px,72%);justify-self:center;margin-bottom:-64px;position:relative;z-index:2;animation:drift 6.5s ease-in-out infinite}
.portrait{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 18px rgba(89,42,44,.16))}
.result{display:grid;gap:10px;padding-top:78px;padding-bottom:22px;position:relative;z-index:1}
.result .deco{position:absolute;width:200px;inset-inline-end:-50px;top:-40px;color:var(--blush);opacity:.55;pointer-events:none}
.result .deco svg{display:block;width:100%;height:auto}
.kicker{font-family:var(--display);font-size:15px;color:var(--blush)}
.result h1{font-size:38px}
.result p{font-size:18px;font-weight:500;line-height:1.8}
.booth{display:grid;gap:2px;margin-top:10px;padding:16px 18px;border-radius:16px;background:var(--rose);color:var(--white)}
.booth b{font-size:18px;font-weight:700}
.booth span{font-size:14px;opacity:.95}
.foot{display:flex;justify-content:center;padding:2px 0 0}
.foot img{display:block;width:86px;height:auto}

.shift-in .portrait{animation:bloom 1s cubic-bezier(.16,1,.3,1) both}
.shift-in .result{animation:rise .55s .05s cubic-bezier(.3,1.2,.5,1) both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes bloom{from{opacity:0;transform:translateY(26px) scale(.86) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

549652 .19099427 .50723269 .272995 .6074066 .39898683 .6074066 .5249939 .6074066 .6069946 .50723269 .6069946 .3549652 .6069946 .20271302 .5249939 .10253906 .39898683 .10253906Z"/><path transform="matrix(107.0777 0 0 -107.0777 1326.9028 728.661)" d="M.39898683-.022460938C.6119995-.022460938 .7519989 .12757874 .7519989 .3549652 .7519989 .583374 .6119995 .7324219 .39898683 .7324219 .18499756 .7324219 .04499817 .583374 .04499817 .3549652 .04499817 .12657166 .18499756-.022460938 .39898683-.022460938M.39898683 .10253906C.272995 .10253906 .19099427 .20271302 .19099427 .3549652 .19099427 .50723269 .272995 .6074066 .39898683 .6074066 .5249939 .6074066 .6069946 .50723269 .6069946 .3549652 .6069946 .20271302 .5249939 .10253906 .39898683 .10253906Z"/><path transform="matrix(107.0777 0 0 -107.0777 1412.3508 728.661)" d="M.067993167 0H.20498657V.5209503H.20698548L.3919983 0H.519989L.7049866 .5209503H.70700076V0H.84399417V.70996096H.6459961L.45700074 .1659851H.45599366L.2659912 .70996096H.067993167V0Z"/></svg>
    </button>
    <span class="sr">ELM BLOOM</span>
    <span class="tag">A FLORAL<br>EXPERIENCE</span>
  </header>

  <main>
    <section class="screen" id="sIntro">
      <div class="hero">
        <i class="icon" aria-hidden="true"><svg viewBox="347 374 319 319" fill="currentColor" data-petals></svg></i>
        <span class="slogan">تزهر اللحظات الحلوة</span>
      </div>
      <div class="card intro-card">
        <h1>وش شخصيتك في موسم الورد؟</h1>
        <p>اللي ما ينقال، يقوله الورد.</p>
        <button class="primary" id="startBtn" type="button">ابدئي</button>
      </div>
    </section>

    <section class="screen" id="sQuiz" hidden>
      <div class="card quiz-card">
        <div class="progress">
          <div class="pattern" id="patternBar" aria-hidden="true"></div>
          <span class="count" aria-hidden="true"><span id="qNum">١</span> / <span id="qTot">٦</span></span>
        </div>
        <p class="sr" id="qLive" aria-live="polite"></p>
        <h2 class="q focus-target" id="qText" tabindex="-1"></h2>
        <div class="options" id="qOpts"></div>
        <button class="back" id="backBtn" type="button">→ السؤال السابق</button>
      </div>
    </section>

    <section class="screen" id="sResult" hidden>
      <div class="portrait-wrap">
        <img class="portrait" id="rArt" alt="" width="626" height="626">
      </div>
      <div class="card result" id="rCard">
        <i class="deco" id="rDeco" aria-hidden="true"></i>
        <span class="kicker">شخصيتك في موسم الورد</span>
        <h1 class="focus-target" id="rName" tabindex="-1"></h1>
        <p id="rDesc"></p>
        <div class="booth">
          <b>ورّي هالشاشة لفريق ELM في البوث</b>
          <span>وخذي هديتك اللي تناسب شخصيتك</span>
        </div>
      </div>
      <footer class="foot">
        <img src="assets/detail-logo-white.png" width="660" height="239" alt="ديتيل للحلول التسويقية">
      </footer>
      <button class="again" id="againBtn" type="button">ابدأ من جديد</button>
    </section>
  </main>
</div>

<script>
(function(){
  // A محققة الباقات · B ملكة التلميحات · C رسولة الاعترافات · D حافظة الأسرار · E صانعة المفاجآت · F مدللة نفسها
  // كل سؤال فيه الخيارات الستة مرة واحدة، ففرص الشخصيات متساوية.
  var QUESTIONS = [
    {q:"جاك بوكيه ورد، وش أول شيء تسويه؟", o:[
      ["أحلل تفاصيله","A"],
      ["ألمّح إني أبيه","B"],
      ["أقرأ رسالته","C"],
      ["أخليه سرّي","D"],
      ["أهدي غيري مثله","E"],
      ["أشتريه لنفسي","F"]]},
    {q:"وش يلفت انتباهك بالورد؟", o:[
      ["التفاصيل","A"],
      ["التلميحات","B"],
      ["الرسالة","C"],
      ["المعنى","D"],
      ["المفاجأة","E"],
      ["الهدية لنفسي","F"]]},
    {q:"إذا بتطلب ورد، كيف؟", o:[
      ["أحدد كل شيء","A"],
      ["ألمّح وبس","B"],
      ["أكتب رسالة","C"],
      ["أخليها سرّ","D"],
      ["أفاجئ غيري","E"],
      ["أطلبه لنفسي","F"]]},
    {q:"أجمل شيء بالبوكيه؟", o:[
      ["تنسيقه","A"],
      ["وصوله بدون طلب","B"],
      ["كلامه","C"],
      ["قصته","D"],
      ["ردة الفعل","E"],
      ["شعوري معه","F"]]},
    {q:"أي لون يشبهك؟", o:[
      ["🤍 أبيض","A"],
      ["💗 وردي","B"],
      ["❤️ أحمر","C"],
      ["💜 بنفسجي","D"],
      ["💛 أصفر","E"],
      ["🧡 خوخي","F"]]},
    {q:"وش أحلى مفاجأة؟", o:[
      ["بوكيه بتفاصيل مميزة","A"],
      ["أحد يفهم تلميحي","B"],
      ["رسالة من القلب","C"],
      ["سرّ بيننا","D"],
      ["هدية بلا موعد","E"],
      ["ورد لنفسي","F"]]}
  ];

  var RESULTS = {
    A:{name:"محققة الباقات", emoji:"🔍🌹", art:"assets/glyphs/a.png",
       desc:"ما يمر عليها بوكيه مرور الكرام! تحلل لون الورد، وعدد الورود، ومعنى البطاقة، وتحاول تكتشف الرسالة المخفية وراء كل هدية."},
    B:{name:"ملكة التلميحات", emoji:"🎀", art:"assets/glyphs/b.png",
       desc:"ما تطلب الورد بشكل مباشر أبدًا، لكن تعرف كيف توصل الرسالة. صورة، ستوري، أو تعليق عابر… والباقي على الشاطر!"},
    C:{name:"رسولة الاعترافات", emoji:"💘", art:"assets/glyphs/c.png",
       desc:"إذا عجزت الكلمات عن التعبير، تخلي الورد يتكلم عنها. تحب الرسائل الرومانسية والهدايا اللي تحمل معاني خفية."},
    D:{name:"حافظة الأسرار", emoji:"🤫", art:"assets/glyphs/d.png",
       desc:"عندها قصة وراء كل وردة، وبعض القصص ما يعرفها أحد. تحب المعاني الخفية والرسائل اللي ما يفهمها إلا أصحابها."},
    E:{name:"صانعة المفاجآت", emoji:"🎁", art:"assets/glyphs/e.png",
       desc:"تحب تهدي الورد بدون مناسبة، وتستمتع بردة فعل الشخص أكثر من الهدية نفسها. تؤمن أن أجمل اللحظات هي اللي تجي بدون موعد."},
    F:{name:"مدللة نفسها", emoji:"💐", art:"assets/glyphs/f.png",
       desc:"ما تنتظر أحد يهديها الورد؛ تشتريه لنفسها وتكافئ نفسها على أبسط إنجاز. تعرف كيف تسعد نفسها بنفسها."}
  };

  var STORE_KEY = "elm-bloom-2026-result";
  var RESET_HOLD_MS = 3000;
  var N = QUESTIONS.length;
  var AR = "٠١٢٣٤٥٦٧٨٩";
  var $ = function(id){ return document.getElementById(id); };
  var ar = function(n){ return String(n).replace(/\d/g, function(d){ return AR[d]; }); };

  $("rDeco").innerHTML = document.querySelector(".bg-flower").innerHTML;
  var PETALS = document.getElementById("petals").innerHTML;
  function fillPetals(root){ Array.prototype.forEach.call(root.querySelectorAll("svg[data-petals]"), function(sv){ sv.innerHTML = PETALS; }); }
  fillPetals(document);

  function shuffled(list){
    var a = list.slice();
    for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function load(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch(e){ return null; } }
  function save(v){ try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch(e){} }
  function clear(){ try { localStorage.removeItem(STORE_KEY); } catch(e){} }

  var state, busy = false;
  function fresh(){
    state = {idx:0, answers:new Array(N), order:QUESTIONS.map(function(Q){ return shuffled(Q.o); })};
  }

  function show(id){
    ["sIntro","sQuiz","sResult"].forEach(function(s){ $(s).hidden = (s !== id); });
    window.scrollTo(0, 0);
  }

  // نقشة الموسم: بتلة، دائرة، بتلة… عنصر لكل سؤال
  var bar = $("patternBar");
  for(var p = 0; p < N; p++){
    var i = document.createElement("i");
    if(p % 2 === 0){ i.className = "p"; i.innerHTML = '<svg viewBox="347 374 319 319" fill="currentColor" data-petals></svg>'; }
    else i.className = "d";
    bar.appendChild(i);
  }
  fillPetals(bar);

  function renderQ(moveFocus){
    var i = state.idx;
    $("qNum").textContent = ar(i + 1);
    $("qTot").textContent = ar(N);
    Array.prototype.forEach.call(bar.children, function(el, k){ el.classList.toggle("on", k <= i); });
    $("qText").textContent = QUESTIONS[i].q;
    $("qLive").textContent = "السؤال " + ar(i + 1) + " من " + ar(N);
    var box = $("qOpts"); box.innerHTML = "";
    state.order[i].forEach(function(opt){
      var b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.textContent = opt[0];
      if(state.answers[i] === opt[1]) b.classList.add("picked");
      b.addEventListener("click", function(){ pick(opt[1], b); });
      box.appendChild(b);
    });
    $("backBtn").disabled = (i === 0);
    if(moveFocus) $("qText").focus();
  }

  function pick(type, el){
    if(busy) return;
    busy = true;
    state.answers[state.idx] = type;
    Array.prototype.forEach.call($("qOpts").children, function(c){ c.classList.remove("picked"); });
    el.classList.add("picked");
    $("backBtn").disabled = true;
    setTimeout(function(){
      busy = false;
      if(state.idx < N - 1){ state.idx++; renderQ(true); }
      else finish();
    }, 260);
  }

  $("backBtn").addEventListener("click", function(){
    if(busy || state.idx === 0) return;
    state.idx--; renderQ(true);
  });

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var n = Math.random() * 16 | 0;
      return (c === "x" ? n : (n & 0x3 | 0x8)).toString(16);
    });
  }

  function record(id, type){
    var body = JSON.stringify({ id: id, personality: type });
    function send(){
      return fetch("/api/complete", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: body,
        keepalive: true
      }).then(function(r){ if(!r.ok) throw new Error("save"); });
    }
    send().catch(function(){ setTimeout(function(){ send().catch(function(){}); }, 1500); });
  }

  function finish(){
    var count = {};
    state.answers.forEach(function(t){ count[t] = (count[t] || 0) + 1; });
    var max = Math.max.apply(null, Object.keys(count).map(function(t){ return count[t]; }));
    // عند التعادل تفوز أول إجابة ضمن الشخصيات الأعلى، بدءاً من السؤال الأول.
    var tied = {};
    Object.keys(count).forEach(function(t){ if(count[t] === max) tied[t] = true; });
    var winner = state.answers.filter(function(t){ return tied[t]; })[0];
    var id = uid();
    save({t:winner, at:Date.now(), id:id});
    record(id, winner);
    showResult(winner, true);
  }

  function showResult(type, animate){
    var R = RESULTS[type];
    $("rArt").src = R.art;
    $("rName").textContent = R.name;
    $("rDesc").textContent = R.desc;
    var sec = $("sResult");
    sec.classList.remove("shift-in");
    if(animate){ void sec.offsetWidth; sec.classList.add("shift-in"); }
    show("sResult");
    $("rName").focus();
  }

  $("startBtn").addEventListener("click", function(){
    fresh(); show("sQuiz"); renderQ(true);
  });

  $("againBtn").addEventListener("click", function(){
    clear(); fresh(); show("sIntro"); $("startBtn").focus();
  });

  // إعادة التشغيل للفريق فقط: ضغطة مطوّلة على الشعار ثلاث ثوانٍ.
  var holdTimer = null;
  function holdStart(e){
    if($("sResult").hidden) return;
    e.preventDefault();
    holdTimer = setTimeout(function(){
      holdTimer = null;
      if(window.confirm("تجهيز الاختبار لزائرة جديدة؟")){ clear(); fresh(); show("sIntro"); $("startBtn").focus(); }
    }, RESET_HOLD_MS);
  }
  function holdEnd(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; } }
  var brand = $("brand");
  brand.addEventListener("pointerdown", holdStart);
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){ brand.addEventListener(ev, holdEnd); });
  brand.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  var saved = load();
  if(saved && RESULTS[saved.t]) showResult(saved.t, false);
  else { fresh(); show("sIntro"); }
})();
</script>
</body>
</html>
